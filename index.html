<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Us Game</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffd9ea;--grad-bg:linear-gradient(160deg,#ffd1e3 0%,#e3d0ff 100%);--card:#fff;--ink:#3b1a4a;--pink:#e0457b;--pink-d:#7c4dff;--butter:#f3e6ff;--mint:#ffe3ef;--shadow:#3b1a4a;--g:linear-gradient(135deg,#e0457b,#7c4dff);--gt:linear-gradient(135deg,#e0457b,#7c4dff);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1040;--grad-bg:linear-gradient(160deg,#2a1040 0%,#4b1747 100%);--card:#3a1d52;--ink:#fdeefe;--butter:#4d2a6b;--mint:#5a2250;--shadow:#12051c;--gt:linear-gradient(135deg,#ff8fb8,#b79bff)}}
:root[data-theme="dark"]{--bg:#2a1040;--grad-bg:linear-gradient(160deg,#2a1040 0%,#4b1747 100%);--card:#3a1d52;--ink:#fdeefe;--butter:#4d2a6b;--mint:#5a2250;--shadow:#12051c;--gt:linear-gradient(135deg,#ff8fb8,#b79bff)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);background-image:var(--grad-bg);background-attachment:fixed;color:var(--ink);font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
.wrap{width:100%;max-width:460px;text-align:center}
.card{background:var(--card);border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--shadow);padding:26px 22px}
h1{background:var(--gt);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--pink);font-size:clamp(2rem,9vw,2.7rem);line-height:1.05;margin:8px 0 12px;font-weight:700}
h2{font-size:1.4rem;line-height:1.25;margin:8px 0 18px;font-weight:600}
p{font-size:1.1rem;line-height:1.45;margin:0 0 18px}
.big{font-size:4rem;line-height:1;display:inline-block;animation:bob 2.2s ease-in-out infinite}
.clue{font-size:3rem;margin:4px 0 8px;letter-spacing:.15em}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
button{font:inherit;font-weight:600;font-size:1.1rem;color:var(--ink);cursor:pointer;border:3px solid var(--ink);border-radius:999px;padding:11px 22px;background:var(--card);box-shadow:0 5px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
button:focus-visible,input:focus-visible{outline:4px solid var(--pink-d);outline-offset:3px}
.primary{background:var(--g);color:#fff}
.opts{display:grid;gap:12px}
.opt{width:100%;text-align:center;line-height:1.3;background:var(--card)}
#otherBox:not(.hide){display:flex;flex-direction:column;gap:12px;margin-top:12px;align-items:center}
#otherBox input,#huntBox input{margin:0 0 14px}
#otherBox input{margin:0}
#next{margin-top:6px}
.opt:hover:not(.sel){background:var(--butter)}
.opt.right{background:var(--mint)}
.opt.wrong{background:#ffc2c2;animation:shake .35s}
.opt.sel{background:var(--g);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
#otherIn{margin:14px 0 0}
.opt:disabled{cursor:default;color:var(--ink)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.round{display:inline-block;font-weight:600;font-size:1rem;background:var(--mint);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:3px 14px}
.bar{height:14px;border:3px solid var(--ink);border-radius:999px;margin:14px 0 4px;overflow:hidden;background:var(--butter)}
.bar i{display:block;height:100%;width:0;background:var(--g);transition:width .4s}
.fb{min-height:3em;font-size:1.05rem;margin:14px 0 8px}
input{font:inherit;font-size:1.1rem;width:100%;padding:12px 16px;border:3px solid var(--ink);border-radius:18px;background:var(--butter);color:var(--ink);text-align:center;margin-bottom:14px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hide{display:none}
.note{background:var(--butter);color:var(--ink);border:3px dashed var(--ink);border-radius:20px;padding:16px;font-size:1.1rem;line-height:1.45;margin:0 0 18px}
.fall{position:fixed;top:-40px;font-size:1.8rem;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.big,.opt.wrong{animation:none}.fall{display:none}}
</style>
</head>
<body>
<main class="wrap">

<section id="start" class="card">
  <div class="big">💌</div>
  <h1 id="title"></h1>
  <p id="intro"></p>
  <button class="primary" id="go">Start game</button>
</section>

<section id="play" class="card hide">
  <span class="round" id="round"></span>
  <div class="bar"><i id="bar"></i></div>
  <h2 id="q"></h2>
  <div class="opts" id="opts"></div>
  <input id="otherIn" class="hide" type="text" autocomplete="off" placeholder="Type your own answer" aria-label="Your own answer">
  <input id="ans" class="hide" type="text" autocomplete="off" placeholder="Type whatever you feel" aria-label="Your answer">
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="btns"><button id="back">Back</button><button class="primary" id="next">Next</button></div>
</section>

<section id="end" class="card hide">
  <div class="big" id="endEmoji">🎁</div>
  <h1 id="endTitle"></h1>
  <p id="endType"></p>
  <div class="note" id="learned" style="text-align:left;background:var(--mint)"></div>
  <p id="sent"></p>
  <div class="note" id="surprise"></div>
  <p id="promise"></p>
  <button class="primary" id="again">Play again</button>
</section>

</main>
<script>
/* ✏️ EDIT THIS PART: make it about the two of you! */
const CONFIG = {
  title: "The Us Game",
  intro: "I made this to know you better, so I can take better care of you. There are no wrong answers, just you. Three short rounds and a surprise at the end.",
  promise: "I made this to know you better, so I can take even better care of you. Thank you for playing with me. 💗",
  rounds: [
    { name: "Round 1: How to love you better", type: "learn", items: [
      { q: "What makes you feel most loved?", a: ["Sweet words", "Time together", "Little surprises", "Help when I'm tired"] },
      { q: "What stresses you most that I could help with?", a: ["Work or studies", "Family stuff", "Overthinking", "Feeling alone"] },
      { q: "How often do you want me to check in?", a: ["Every day", "A few times a day", "Only when you need me", "Surprise me"] }
    ]},
    { name: "Round 2: Pick my promise", type: "learn", items: [
      { q: "Which promise do you want from me most?", a: ["I'll listen first", "I'll always make time for you", "I'll surprise you more", "I'll never let you feel alone"] },
      { q: "What small thing should I do more often?", a: ["Text you first", "Plan dates", "Say sweet things", "Hug you for no reason"] }
    ]},
    { name: "Round 3: Which couple are we?", type: "vibe", items: [
      { q: "What's our dream date?", a: [["Movie night at home", "A"], ["A surprise trip somewhere new", "B"], ["Cooking dinner together", "C"], ["Something silly and spontaneous", "D"]] },
      { q: "How do we handle a disagreement?", a: [["Talk it out over food", "A"], ["Laugh and forget it", "D"], ["Take a walk and reset", "B"], ["Hug it out", "C"]] },
      { q: "Our love language?", a: [["Quality time", "C"], ["Silly memes", "D"], ["Surprise adventures", "B"], ["Sharing snacks", "A"]] }
    ]}
  ],
  couples: {
    A: { e: "🍿", t: "The Cozy Snack Duo", s: "Blankets, snacks and a show. You two are pure comfort." },
    B: { e: "🧭", t: "The Adventure Buddies", s: "Always up for the next plan. Life with you two is never boring." },
    C: { e: "🏡", t: "The Homebody Sweethearts", s: "Home is wherever you two are. Warm, steady, adorable." },
    D: { e: "🎉", t: "The Chaos Besties", s: "Zero plans, maximum laughs. Best friends who also kiss." }
  },
  surprise: "🎁 Your prize: a surprise date planned just for you. I love you."
};

const $ = id => document.getElementById(id);
const show = id => ["start","play","end"].forEach(x => $(x).classList.toggle("hide", x !== id));
const steps = [];
CONFIG.rounds.forEach(r => r.items.forEach(it => steps.push({ ...it, type: r.type, round: r.name })));
let n = 0, ans = [];

$("title").textContent = CONFIG.title;
$("intro").textContent = CONFIG.intro;

function render(){
  const s = steps[n], cur = ans[n], hunt = s.type === "hunt";
  $("round").textContent = s.round;
  $("bar").style.width = (n / steps.length * 100) + "%";
  $("q").textContent = s.q;
  $("opts").innerHTML = "";
  $("otherIn").classList.toggle("hide", hunt || !(cur && cur.other));
  $("ans").classList.toggle("hide", !hunt);
  $("otherIn").value = cur && cur.other ? cur.text : "";
  $("ans").value = hunt && cur ? cur.text : "";
  if (!hunt){
    s.a.forEach(opt => {
      const text = Array.isArray(opt) ? opt[0] : opt;
      const b = document.createElement("button");
      b.className = "opt" + (cur && !cur.other && cur.text === text ? " sel" : "");
      b.textContent = text;
      b.onclick = () => { ans[n] = { text, tag: Array.isArray(opt) ? opt[1] : null }; render(); };
      $("opts").appendChild(b);
    });
    const o = document.createElement("button");
    o.className = "opt" + (cur && cur.other ? " sel" : "");
    o.textContent = "✏️ Something else";
    o.onclick = () => { if (!(cur && cur.other)) ans[n] = { text: "", other: true }; render(); $("otherIn").focus(); };
    $("opts").appendChild(o);
  }
  $("back").classList.toggle("hide", n === 0);
  $("next").textContent = n === steps.length - 1 ? "Open my prize" : "Next";
  update();
}

function update(){
  const cur = ans[n];
  const ok = !!(cur && cur.text.trim());
  $("next").disabled = !ok;
  $("fb").textContent = ok ? "Noted 💗" : "";
}

function rain(list, count){
  for (let k = 0; k < count; k++){
    const e = document.createElement("div");
    e.className = "fall";
    e.textContent = list[k % list.length];
    e.style.left = Math.random() * 100 + "vw";
    e.style.animationDuration = 2 + Math.random() * 2 + "s";
    e.style.animationDelay = Math.random() * .6 + "s";
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 5000);
  }
}

function finish(){
  const tally = {}, log = [];
  steps.forEach((s, i) => {
    const a = ans[i];
    if (!a) return;
    if (s.type === "vibe" && a.tag) tally[a.tag] = (tally[a.tag] || 0) + 1;
    else if (s.type !== "vibe") log.push([s.q.replace(/^Clue \d: /, ""), a.text.trim()]);
  });
  const top = Object.keys(CONFIG.couples).sort((x, y) => (tally[y] || 0) - (tally[x] || 0))[0];
  const c = CONFIG.couples[top];
  $("endEmoji").textContent = c.e;
  $("endTitle").textContent = "You did it!";
  $("endType").textContent = "Our couple type: " + c.t + ". " + c.s;
  $("learned").innerHTML = "";
  const h = document.createElement("strong");
  h.textContent = "What I learned about you";
  $("learned").appendChild(h);
  log.forEach(([q, a]) => {
    const d = document.createElement("div");
    d.style.marginTop = "8px";
    d.textContent = q + " " + a;
    $("learned").appendChild(d);
  });
  $("surprise").textContent = CONFIG.surprise;
  $("promise").textContent = CONFIG.promise;
  show("end");
  rain(["💖","🌸","✨","🍓"], 30);
  sendAnswers(log, c.t);
}

/* 📩 Get a free key at https://web3forms.com (enter your email) and paste it here */
const ACCESS_KEY = "PASTE_YOUR_WEB3FORMS_KEY_HERE";

const FALLBACK = "I couldn't send your answers automatically. Please screenshot this card and send it to me 💗";
async function sendAnswers(log, couple){
  const out = $("sent");
  out.textContent = "Sending your answers to me...";
  try {
    const message = "Couple type: " + couple + "\n\n" + log.map(([q, a]) => q + "\n→ " + a).join("\n\n");
    const res = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ access_key: ACCESS_KEY, subject: "Her answers from The Us Game 💗", from_name: "The Us Game", message })
    });
    const data = await res.json();
    if (!data.success) throw 0;
    out.textContent = "Your answers were sent to me automatically 💗";
  } catch (e) { out.textContent = FALLBACK; }
}

$("go").onclick = () => { n = 0; ans = []; show("play"); render(); };
$("next").onclick = () => { if (n < steps.length - 1){ n++; render(); } else finish(); };
$("back").onclick = () => { if (n > 0){ n--; render(); } };
$("otherIn").addEventListener("input", e => { ans[n] = { text: e.target.value, other: true }; update(); });
$("ans").addEventListener("input", e => { ans[n] = { text: e.target.value }; update(); });
$("ans").addEventListener("keydown", e => { if (e.key === "Enter" && !$("next").disabled) $("next").click(); });
$("otherIn").addEventListener("keydown", e => { if (e.key === "Enter" && !$("next").disabled) $("next").click(); });
$("again").onclick = () => show("start");
</script>
</body>
</html>
